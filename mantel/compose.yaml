# Offline deployment: one container, no registry access required.
#
# Use this only on a machine that cannot pull images. Everyone else should use
# the top-level docker-compose.example.yml, which pulls a prebuilt image.
#
#   docker load --input mantel.tar.gz
#   docker compose -f compose.yaml config --quiet
#   docker compose -f compose.yaml up -d --wait --wait-timeout 90
#
# The archive is produced by ../scripts/export-nas-image.sh and is not committed
# to the repository. Immich is configured from the controller after startup, so
# there is no .env to fill in.

services:
  mantel:
    # Loaded from mantel.tar.gz above, never pulled.
    image: mantel:latest
    pull_policy: never
    ports:
      - '${MANTEL_BIND_ADDRESS:-0.0.0.0}:${MANTEL_PLAYER_PORT:-3830}:8780'
      - '${MANTEL_BIND_ADDRESS:-0.0.0.0}:${MANTEL_CONTROLLER_PORT:-3831}:8781'
    environment:
      TZ: ${TZ:-UTC}
      PORT: 8780
      CONTROL_PORT: 8781
      PUBLIC_PLAYER_PORT: ${MANTEL_PLAYER_PORT:-3830}
      PUBLIC_CONTROL_PORT: ${MANTEL_CONTROLLER_PORT:-3831}
      MANTEL_PUID: ${MANTEL_PUID:-10001}
      MANTEL_PGID: ${MANTEL_PGID:-10001}
      PLAYLIST_REFRESH_MINUTES: 60
      CACHE_CONCURRENCY: 4
      IMAGE_CACHE_MAX_GB: 20
    volumes:
      # Config, caches and map imagery. Survives replacing the bundle.
      - type: bind
        source: ${MANTEL_DATA_DIR:-./mantel-data}
        target: /data
        bind:
          create_host_path: true
    mem_limit: ${MANTEL_MEMORY_LIMIT:-2g}
    mem_reservation: ${MANTEL_MEMORY_RESERVATION:-512m}
    cpus: ${MANTEL_CPU_LIMIT:-2.0}
    restart: unless-stopped
