name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch newly disclosed vulnerabilities in dependencies that have not changed.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks should see history, not just the tip.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  config:
    name: Container and workflow config (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check checkov
      - name: Scan
        run: |
          checkov --directory . \
            --framework dockerfile,github_actions,secrets \
            --skip-path node_modules --skip-path .svelte-kit \
            --compact --quiet

  static-analysis:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check semgrep==1.185.0
      - name: Scan
        # Reads the code for insecure patterns. Exceptions are written next to the line they
        # cover, with the reason.
        run: semgrep scan --config p/default --metrics off --error --quiet

  dependencies:
    name: Dependencies (npm audit + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit
        # Advisory only: a transitive dev-dependency advisory should not block a
        # photo frame's pull request. Read the output, do not ignore it.
        run: npm audit --omit=dev || true
      - name: Install trivy
        run: |
          VERSION=0.76.2
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: Filesystem scan
        run: trivy fs . --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules
