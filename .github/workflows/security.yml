name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch newly disclosed vulnerabilities in dependencies that have not changed.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks should see history, not just the tip.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  config:
    name: Container and workflow config (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check checkov
      - name: Scan
        run: |
          checkov --directory . \
            --framework dockerfile,github_actions,secrets \
            --skip-path node_modules --skip-path .svelte-kit \
            --compact --quiet

  dependencies:
    name: Dependencies (npm audit + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit
        # Advisory only: a transitive dev-dependency advisory should not block a
        # photo frame's pull request. Read the output, do not ignore it.
        run: npm audit --omit=dev || true
      - name: Install trivy
        run: |
          VERSION=0.58.1
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version
      - name: Filesystem scan
        run: trivy fs . --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules
