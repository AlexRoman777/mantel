<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d">
  <title id="t">How Mantel fits together</title>
  <desc id="d">Your Immich server is read by one Mantel container, which serves photos to player screens on port 3830 and a settings controller on port 3831. The Immich API key never leaves the Mantel container, and no photo leaves your network.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>

  <style>
    .lbl   { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #fafafa; }
    .sub   { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #a1a1aa; }
    .big   { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #fbbf24; }
    .flow  { font: 500 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #a1a1aa; }
    .port  { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fbbf24; }
    .note  { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #86efac; }
    .card  { fill: #18181b; stroke: #3f3f46; stroke-width: 1.5; }
    .inner { fill: #202024; stroke: #3f3f46; stroke-width: 1; }
    .host  { fill: #1c1917; stroke: #fbbf24; stroke-width: 2; }
    .keep  { fill: #14281c; stroke: #2f6b45; stroke-width: 1.5; }
    .arrow { stroke: #a1a1aa; stroke-width: 2; fill: none; }
    .dash  { stroke: #71717a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  </style>

  <!-- Immich -->
  <rect class="card" x="16" y="150" width="176" height="104" rx="10"/>
  <text class="lbl" x="104" y="186" text-anchor="middle">Your Immich server</text>
  <text class="sub" x="104" y="208" text-anchor="middle">already running,</text>
  <text class="sub" x="104" y="225" text-anchor="middle">already holds your photos</text>

  <!-- arrow Immich -> Mantel -->
  <path class="arrow" d="M196 202 L294 202" marker-end="url(#ar)"/>
  <text class="flow" x="249" y="192" text-anchor="middle">reads, never writes</text>

  <!-- Mantel host -->
  <rect class="host" x="300" y="54" width="360" height="362" rx="14"/>
  <text class="big" x="480" y="88" text-anchor="middle">Mantel</text>
  <text class="sub" x="480" y="108" text-anchor="middle">one container, on a NAS, a Pi or any Linux box</text>

  <rect class="inner" x="324" y="128" width="312" height="46" rx="8"/>
  <text class="lbl" x="480" y="150" text-anchor="middle">Immich reader</text>
  <text class="sub" x="480" y="167" text-anchor="middle">a read-only key, nine permissions, albums you allow</text>

  <rect class="keep" x="324" y="186" width="312" height="40" rx="8"/>
  <text class="note" x="480" y="211" text-anchor="middle">The API key stops here. Browsers never see it.</text>

  <rect class="inner" x="324" y="238" width="312" height="46" rx="8"/>
  <text class="lbl" x="480" y="260" text-anchor="middle">Photo cache</text>
  <text class="sub" x="480" y="277" text-anchor="middle">only what it shows · faces · playback position</text>

  <rect class="inner" x="324" y="296" width="312" height="46" rx="8"/>
  <text class="lbl" x="480" y="318" text-anchor="middle">Presentations</text>
  <text class="sub" x="480" y="335" text-anchor="middle">sources, layout, overlays — one profile per screen</text>

  <text class="port" x="480" y="376" text-anchor="middle">:3830 players     ·     :3831 controller</text>
  <text class="sub" x="480" y="396" text-anchor="middle">separate ports, so a television never shows an admin page</text>

  <!-- arrows out -->
  <path class="arrow" d="M664 150 L728 150" marker-end="url(#ar)"/>
  <text class="flow" x="696" y="140" text-anchor="middle">photos</text>

  <path class="arrow" d="M664 322 L728 322" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text class="flow" x="696" y="312" text-anchor="middle">control</text>

  <!-- Players -->
  <rect class="card" x="732" y="92" width="192" height="134" rx="10"/>
  <text class="lbl" x="828" y="120" text-anchor="middle">Screens</text>
  <text class="sub" x="828" y="142" text-anchor="middle">a television in kiosk mode,</text>
  <text class="sub" x="828" y="159" text-anchor="middle">a spare tablet, an old phone,</text>
  <text class="sub" x="828" y="176" text-anchor="middle">any browser in the house</text>
  <text class="sub" x="828" y="202" text-anchor="middle">open the page — it starts</text>

  <!-- Controller -->
  <rect class="card" x="732" y="264" width="192" height="116" rx="10"/>
  <text class="lbl" x="828" y="292" text-anchor="middle">Controller</text>
  <text class="sub" x="828" y="314" text-anchor="middle">your phone or laptop</text>
  <text class="sub" x="828" y="336" text-anchor="middle">pick albums, change a</text>
  <text class="sub" x="828" y="353" text-anchor="middle">screen, skip a photo</text>

  <!-- optional outbound -->
  <path class="dash" d="M480 420 L480 442" marker-end="url(#ard)"/>
  <text class="flow" x="480" y="462" text-anchor="middle">Only if you switch them on: weather, map detail, transit times. Each one is listed in PRIVACY.md.</text>

  <!-- boundary note -->
  <text class="flow" x="104" y="286" text-anchor="middle">Everything above stays</text>
  <text class="flow" x="104" y="302" text-anchor="middle">on your own network.</text>
</svg>
